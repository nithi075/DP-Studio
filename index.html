<!doctype html>

<html lang="en">

<head>

  <!-- ================= BASIC ================= -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#000000"
  />

  <!-- ================= SEO ================= -->

  <title>
    DP Photography | Wedding & Cinematic Photography
  </title>

  <meta
    name="description"
    content="DP Photography captures timeless cinematic moments with premium wedding, engagement, maternity, birthday, and portrait photography."
  />

  <meta
    name="keywords"
    content="DP Photography, Wedding Photography, Cinematic Photography, Couple Shoot, Tamil Nadu Photographer, Engagement Photography, Birthday Photography"
  />

  <meta
    name="author"
    content="DP Photography"
  />

  <meta
    name="robots"
    content="index, follow"
  />

  <!-- ================= CANONICAL ================= -->

  <link
    rel="canonical"
    href="https://www.dp-photography.in/"
  />

  <!-- ================= FAVICON ================= -->

  <link
    rel="icon"
    href="/dp-favicon.ico"
    type="image/x-icon"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32.png"
  />

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16.png"
  />

  <!-- ================= OPEN GRAPH ================= -->

  <meta
    property="og:title"
    content="DP Photography"
  />

  <meta
    property="og:description"
    content="Capturing timeless cinematic moments with premium photography."
  />

  <meta
    property="og:image"
    content="https://www.dp-photography.in/preview.jpg"
  />

  <meta
    property="og:url"
    content="https://www.dp-photography.in/"
  />

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:site_name"
    content="DP Photography"
  />

  <meta
    property="og:locale"
    content="en_IN"
  />

  <!-- ================= TWITTER ================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="DP Photography"
  />

  <meta
    name="twitter:description"
    content="Capturing timeless cinematic moments with premium photography."
  />

  <meta
    name="twitter:image"
    content="https://www.dp-photography.in/preview.jpg"
  />

  <!-- ================= PRELOAD ================= -->

  <link
    rel="preload"
    as="image"
    href="/preview.jpg"
  />

</head>

<body>

  <div id="root"></div>

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
